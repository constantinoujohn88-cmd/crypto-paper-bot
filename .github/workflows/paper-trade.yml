name: Paper trade check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py --once

      - name: Commit updated ledger/history
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in ledger.json history.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --cached --quiet || git commit -m "Bot check: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
