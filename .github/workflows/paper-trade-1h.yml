name: Paper trade check (1h bot)

on:
  # schedule trigger disabled - the Railway worker (railway_worker.py) now
  # runs this bot's checks continuously and more reliably. Kept here as a
  # manual fallback only. See README's Railway section.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py --bot 1h --once

      - name: Commit updated ledger/history
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in ledger_1h.json history_1h.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --cached --quiet || git commit -m "1h bot check: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin main
          git push
